[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "damascus"
version = "0.1.0"
description = "Confidence-gated multimodal fusion for early osteoarthritis assessment (RegBridge)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "torch==2.1.0",
    "torchvision==0.16.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "msgspec>=0.18",
    "typer>=0.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4", "black>=24.0", "isort>=5.12", "mypy>=1.8", "pre-commit>=3.5"]

[project.scripts]
damascus = "damascus.anvil.commands:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["damascus*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["damascus"]
src_paths = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["damascus"]

[tool.mypy]
python_version = "3.11"
files = ["src/damascus"]
strict = true
warn_return_any = false
disallow_untyped_calls = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
